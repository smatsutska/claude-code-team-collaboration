name: Feedback / critique
description: Tell us what's wrong with this operating model
title: "[feedback] "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Blunt is welcome.

        Waves 0 and 1 have been run. Scoreboards: [W0-RESULTS.md](../blob/main/W0-RESULTS.md) and
        [W1-RESULTS.md](../blob/main/W1-RESULTS.md). Bets #1–#14 are in
        [FEEDBACK.md](../blob/main/FEEDBACK.md); the governance bets #15–#23, registered with
        thresholds before trial 3, are in [W2-BETS.md](../blob/main/W2-BETS.md), and the trial-3
        results in [TRIAL-3-RESULTS.md](../blob/main/TRIAL-3-RESULTS.md).
        Nothing below is required except the last field; fill in what's relevant.

  - type: input
    id: bet
    attributes:
      label: Which bet or finding does this concern?
      description: |
        A bet number (1–23), a finding letter (A–E in W0-RESULTS.md, F–L in W1-RESULTS.md,
        M–R in TRIAL-3-RESULTS.md), or "blind spot" if it is something nobody listed.
      placeholder: "e.g. 16, or: finding M, or: blind spot"

  - type: dropdown
    id: kind
    attributes:
      label: What kind of feedback is this?
      options:
        - This is wrong, and here's what happens
        - You're missing something entirely
        - We solved this differently
        - Prior art you should read
        - This is right, and here's why it held up
        - Something else

  - type: textarea
    id: body
    attributes:
      label: The feedback
      description: |
        Most useful shape: what breaks, when it breaks, and what you saw instead.
        Concrete experience beats general principle.
      placeholder: "In our team, the advisory gate never became blocking because…"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Your context (optional)
      description: Team size, domain, how long you've been running agent-driven delivery. Helps us weight the advice.
